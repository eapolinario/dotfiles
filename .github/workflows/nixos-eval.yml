name: NixOS Checks

on:
  push:
    branches:
      - main
    paths:
      - 'nixos/**'
      - '.github/workflows/nixos-eval.yml'
  pull_request:
    paths:
      - 'nixos/**'
      - '.github/workflows/nixos-eval.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Resolve host metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nixos
    outputs:
      eval_hosts: ${{ steps.metadata.outputs.eval_hosts }}
      build_host: ${{ steps.metadata.outputs.build_host }}
      build_runner: ${{ steps.metadata.outputs.build_runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read CI metadata from flake
        id: metadata
        run: |
          set -euo pipefail

          build_host="$(nix eval --raw .#lib.ciMetadata.defaultBuildHost.name)"
          build_runner="$(nix eval --raw .#lib.ciMetadata.defaultBuildHost.runner)"
          eval_hosts="$(nix eval --raw .#lib.ciMetadata.evalHostsText)"

          printf 'build_host=%s\n' "$build_host" >> "$GITHUB_OUTPUT"
          printf 'build_runner=%s\n' "$build_runner" >> "$GITHUB_OUTPUT"
          printf 'eval_hosts=%s\n' "$eval_hosts" >> "$GITHUB_OUTPUT"

  eval:
    name: Flake check and host evaluation
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    defaults:
      run:
        working-directory: nixos
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ env.CACHIX_AUTH_TOKEN == '' }}
          extraPullNames: nix-community

      - name: Check formatting
        run: make fmt-check

      - name: Run flake checks
        run: make check HOSTS="${{ needs.metadata.outputs.eval_hosts }}"

  build-arm64:
    name: Configured host toplevel build
    if: github.event_name != 'pull_request'
    runs-on: ${{ needs.metadata.outputs.build_runner }}
    needs:
      - metadata
      - eval
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    defaults:
      run:
        working-directory: nixos
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ env.CACHIX_AUTH_TOKEN == '' }}
          extraPullNames: nix-community

      - name: Build configured host toplevel
        run: make build-host HOST="${{ needs.metadata.outputs.build_host }}" NIX="nix -L --cores 0"
