name: NixOS Eval

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    name: Flake check and host evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nixos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: make check
