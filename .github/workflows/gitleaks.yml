name: Gitleaks Guard

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly full-tree sweep so new rules in upstream gitleaks pick up old commits.
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  run-gitleaks:
    name: Scan with gitleaks (diff mode)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
            fetch-depth: 0
      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_NOTIFY_USER_LIST: "@eapolinario"

  full-tree-scan:
    # gitleaks-action's diff mode can miss leaks introduced via large file
    # additions (which is how the historical .zsh_history leak slipped past
    # CI). Run an explicit `gitleaks dir` over the working tree as a second
    # line of defense.
    name: Scan with gitleaks (full tree)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks dir scan
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
